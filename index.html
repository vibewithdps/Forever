<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Authorized Store | +91 7037788052</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal-active { overflow: hidden; }
        #product-modal { background-color: rgba(0, 0, 0, 0.95); z-index: 1000; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #f97316; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-orange-600 italic tracking-tighter">FOREVER™ SHOP</h1>
            
            <div class="relative w-full md:w-1/2">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Product search karein..." class="w-full border-2 border-orange-100 rounded-full px-5 py-2 focus:border-orange-500 outline-none">
            </div>

            <div class="text-right hidden md:block">
                <p class="text-sm font-bold text-gray-800">+91 7037788052</p>
                <p class="text-[9px] text-gray-400 uppercase tracking-widest font-black">thakurdps795@gmail.com</p>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 mt-6 flex flex-wrap gap-2 justify-center">
        <button onclick="filterCategory('all')" class="bg-orange-600 text-white px-4 py-1 rounded-full text-xs font-bold">All</button>
        <button onclick="filterCategory('Health')" class="bg-white border border-orange-200 px-4 py-1 rounded-full text-xs font-bold">Health</button>
        <button onclick="filterCategory('Skin')" class="bg-white border border-orange-200 px-4 py-1 rounded-full text-xs font-bold">Skin & Hair</button>
        <button onclick="filterCategory('Energy')" class="bg-white border border-orange-200 px-4 py-1 rounded-full text-xs font-bold">Energy Bars/Drinks</button>
    </div>

    <main class="container mx-auto py-10 px-4">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <div id="product-modal" class="fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] max-w-lg w-full p-8 relative shadow-2xl overflow-y-auto max-h-[90vh] custom-scroll">
            <button onclick="closeModal()" class="absolute top-4 right-6 text-3xl text-gray-300 hover:text-black">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-gray-900 text-white py-16 text-center mt-20">
        <p class="text-lg font-black mb-1">WhatsApp: +91 7037788052</p>
        <p class="text-gray-400 text-sm mb-6 uppercase tracking-widest">thakurdps795@gmail.com</p>
        <div class="text-[9px] text-gray-600 font-bold uppercase tracking-[0.3em]">100% Original Forever Business Owner Products</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
